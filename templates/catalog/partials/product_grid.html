<div class="mb-4 text-sm text-ink/60">{{ products|length }} styles</div>
{% if products %}
<div class="grid grid-cols-2 md:grid-cols-3 gap-5 lg:gap-7">
  {% for product in products %}
    {% include "catalog/partials/product_card.html" %}
  {% endfor %}
</div>
{% else %}
<div class="py-20 text-center text-ink/50">
  <p class="font-display text-3xl text-maroon/40 mb-2">No pieces found</p>
  <p>Try adjusting filters or search.</p>
</div>
{% endif %}
